services:
  travel:
    build: .
    init: true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      TRIPWEAVE_ACCESS_PASSWORD: ${TRIPWEAVE_ACCESS_PASSWORD:?Set a private access password in .env}
      TRIPWEAVE_MODEL_MODE: ${TRIPWEAVE_MODEL_MODE:-rules}
      TRIPWEAVE_API_KEY: ${TRIPWEAVE_API_KEY:-}
      TRIPWEAVE_MODEL: ${TRIPWEAVE_MODEL:-}
      TRIPWEAVE_BASE_URL: ${TRIPWEAVE_BASE_URL:-}
      TRIPWEAVE_WEATHER_PROVIDER: ${TRIPWEAVE_WEATHER_PROVIDER:-sample}
    volumes:
      - travel-data:/app/TripWeave/var
    restart: unless-stopped
volumes:
  travel-data:
