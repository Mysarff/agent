name: Travel agent checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m SmartVoyage.verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-verification
          path: reports/intelligence_verification.json
